name = "gtz"
version = "0.1.0"
defaultTargets = ["Gtz", "Skeleton"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.0-rc1"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
# MIGRATION DEBT, v4.32.0 -> v4.34.0-rc1.  Lean v4.33 turned this option on by
# default (lean4#13895).  Under it a `Matrix` no longer unfolds to its function
# type at `implicit` transparency, so `rw` and `simp` steps that matched through
# that unfolding stop to fire.  The documented symptom is a lemma that silently
# stops to apply.  A value of false here restores the v4.32 behavior tree-wide
# while the real fixes land declaration by declaration.
# TODO(gtz): narrow this to the declarations that need it, then delete it.
backward.isDefEq.respectTransparency.types = false

[[lean_lib]]
name = "Gtz"

# The obligation scaffold.  Separate library, separate module root: Gtz/Audit.lean's
# sweep enumerates theorems whose module root is `Gtz`, so it never sees these, and
# the Gtz tree keeps its zero-axiom guarantee while Skeleton carries the named
# obligations that rank-three and general-rank GTZ still rest on.
[[lean_lib]]
name = "Skeleton"
